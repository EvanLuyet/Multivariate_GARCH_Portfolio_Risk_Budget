[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E402: module-level import not at top — intentional in submodules that use sys.path.insert
# for standalone __main__ execution (each layer can be run directly without installing the pkg)
ignore = ["E402"]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
